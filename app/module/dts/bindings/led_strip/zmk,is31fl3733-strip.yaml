description: ISSI IS31FL3733 RGB LED Matrix Strip Driver

compatible: "zmk,is31fl3733-strip"

include: "i2c-device.yaml"

properties:
  chain-length:
    type: int
    required: true
    description: Number of RGB pixels controlled by the matrix (up to 64).

  sdb-gpios:
    type: phandle-array
    description: Hardware shutdown / power enable pin (active high).

  current-limit:
    type: int
    default: 128
    description: Global current control register value (0..255).

  sync-mode:
    type: string
    default: "none"
    enum:
      - "none"
      - "master"
      - "slave"
    description: Multi-device clock synchronization mode.

  sw-pullup:
    type: int
    default: 0
    description: |
      SWy pull-up resistor selection (Page 3, 0x0F, bits D2:D0):
      0=none, 1=0.5k, 2=1k, 3=2k, 4=4k, 5=8k, 6=16k, 7=32k.

  cs-pulldown:
    type: int
    default: 0
    description: |
      CSx pull-down resistor selection (Page 3, 0x10, bits D2:D0):
      0=none, 1=0.5k, 2=1k, 3=2k, 4=4k, 5=8k, 6=16k, 7=32k.
